<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appointments</title>

  <!-- Tailwind & libs -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.6/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Quick inline styles -->
  <style>
    .modal { display:block; position:fixed; z-index:1050; left:0; top:0; width:100%; height:100%; overflow:auto; background:rgba(0,0,0,.5); }
    .modal-dialog { margin:10% auto; max-width:500px; }
    .modal-content { background:#fff; padding:20px; border-radius:5px; }
    .modal-content::-webkit-scrollbar { width:8px; }
    .modal-content::-webkit-scrollbar-thumb { background:rgba(0,0,0,.2); border-radius:4px; }
    .hover-shadow:hover { box-shadow:0 4px 20px rgba(0,0,0,.2); transition:box-shadow .3s ease; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 🔗 Point straight at the GitHub-Pages JSON
    const DATA_URL = 'https://infisparks.github.io/medzealbackup/data.json';

    const AppointmentsPage = () => {
      const [appointments, setAppointments] = useState([]);
      const [selectedDate, setSelectedDate] = useState('');
      const [selectedMonth, setSelectedMonth] = useState('');
      const [selectedYear, setSelectedYear] = useState('');
      const [searchTerm, setSearchTerm] = useState('');
      const [editingAppointment, setEditingAppointment] = useState(null);

      const currentYear = new Date().getFullYear();

      /* ---------- Load JSON once ---------- */
      useEffect(() => {
        fetch(DATA_URL)
          .then(res => res.json())
          .then(data => {
            const attended = Object.entries(data.appointments)
              .flatMap(([key, group]) =>
                Object.entries(group).map(([id, details]) => ({
                  ...details, id, key
                }))
              )
              .filter(a => a.approved && a.attended);
            setAppointments(attended);
          })
          .catch(err => {
            console.error('Error loading JSON:', err);
            setAppointments([]);
          });
      }, []);

      /* ---------- Derived lists & totals ---------- */
      const filteredAppointments = useMemo(() => {
        if (!appointments) return [];
        return appointments.filter(({ appointmentDate, doctor, message, name, phone }) => {
          const [year, month] = appointmentDate.split('-');
          const dateMatch   = selectedDate  ? appointmentDate === selectedDate : true;
          const monthMatch  = selectedMonth ? month === selectedMonth          : true;
          const yearMatch   = selectedYear  ? year  === selectedYear           : true;
          const search = searchTerm.toLowerCase();
          const textMatch  = doctor.toLowerCase().includes(search) ||
                             message.toLowerCase().includes(search) ||
                             name.toLowerCase().includes(search) ||
                             phone.includes(search);
          return dateMatch && monthMatch && yearMatch && textMatch;
        });
      }, [appointments, selectedDate, selectedMonth, selectedYear, searchTerm]);

      const totalPrice = useMemo(
        () => filteredAppointments.reduce((sum, { price }) => {
          const n = parseFloat(price);
          return isNaN(n) || n <= 0 ? sum : sum + n;
        }, 0),
        [filteredAppointments]
      );

      const today = new Date().toISOString().split('T')[0];

      /* ---------- Export ---------- */
      const handleExport = () => {
        const ws = XLSX.utils.json_to_sheet(
          filteredAppointments.map(a => ({
            Date      : a.appointmentDate,
            Time      : a.appointmentTime,
            Doctor    : a.doctor,
            Message   : a.message,
            Price     : a.price,
            Name      : a.name,
            Phone     : a.phone,
            SubCategory: a.subCategory,
            Treatment : a.treatment,
          }))
        );
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Appointments');
        XLSX.writeFile(wb, 'appointments.xlsx');
      };

      /* ---------- Edit helpers ---------- */
      const handleEdit  = appt => setEditingAppointment(appt);
      const handleChange= e =>
        setEditingAppointment(prev => ({ ...prev, [e.target.name]: e.target.value }));
      const handleSave  = e => { e.preventDefault(); console.log('Updated:', editingAppointment); setEditingAppointment(null); };

      /* ---------- Render ---------- */
      return (
        <div className="container mx-auto mt-5 px-4">
          <h1 className="text-4xl text-center mb-4">Appointments</h1>

          <input
            className="w-full p-2 border rounded mb-4"
            placeholder="Search by doctor, message, name, or phone"
            value={searchTerm}
            onChange={e=>setSearchTerm(e.target.value)}
          />

          <div className="flex flex-wrap -mx-2 mb-4">
            {/* Date filter */}
            <div className="w-full md:w-1/3 px-2 mb-3">
              <label className="block mb-1">Select Date:</label>
              <input type="date" value={selectedDate}
                     onChange={e=>setSelectedDate(e.target.value)}
                     className="w-full p-2 border rounded"/>
            </div>
            {/* Month filter */}
            <div className="w-full md:w-1/3 px-2 mb-3">
              <label className="block mb-1">Select Month:</label>
              <select value={selectedMonth} onChange={e=>setSelectedMonth(e.target.value)}
                      className="w-full p-2 border rounded">
                <option value="">All Months</option>
                {Array.from({length:12},(_,i)=>(
                  <option key={i} value={String(i+1).padStart(2,'0')}>
                    {new Date(0,i).toLocaleString('default',{month:'long'})}
                  </option>
                ))}
              </select>
            </div>
            {/* Year filter */}
            <div className="w-full md:w-1/3 px-2 mb-3">
              <label className="block mb-1">Select Year:</label>
              <select value={selectedYear} onChange={e=>setSelectedYear(e.target.value)}
                      className="w-full p-2 border rounded">
                <option value="">All Years</option>
                {Array.from({length:10},(_,i)=>currentYear-i).map(y=>
                  <option key={y} value={y}>{y}</option>)}
              </select>
            </div>
          </div>

          <button onClick={()=>setSelectedDate(today)}
                  className="bg-blue-500 text-white px-4 py-2 rounded mb-4">
            Today&nbsp;Appointments
          </button>

          <button onClick={handleExport}
                  className="bg-green-500 text-white px-4 py-2 rounded mb-4 float-right">
            Export&nbsp;to&nbsp;Excel
          </button>

          <h2 className="text-lg mb-2">Total Price: ₹{totalPrice.toFixed(2)}</h2>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {filteredAppointments.length ? filteredAppointments.map(appt=>(
              <div key={appt.id} className="border rounded shadow-sm hover-shadow p-4">
                <p><strong>Date:</strong> {appt.appointmentDate}</p>
                <p><strong>Time:</strong> {appt.appointmentTime}</p>
                <p><strong>Doctor:</strong> {appt.doctor}</p>
                <p><strong>Message:</strong> {appt.message}</p>
                <p><strong>Price:</strong> ₹{appt.price}</p>
                <p><strong>Name:</strong> {appt.name}</p>
                <p><strong>Phone:</strong> {appt.phone}</p>
                <p><strong>SubCategory:</strong> {appt.subCategory}</p>
                <p><strong>Treatment:</strong> {appt.treatment}</p>
                <button onClick={()=>handleEdit(appt)}
                        className="bg-blue-500 text-white px-3 py-1 rounded">
                  Edit
                </button>
              </div>
            )) : (
              <p className="col-span-2 text-center text-gray-500">
                No appointments found for the selected criteria.
              </p>
            )}
          </div>

          {/* ---------- Edit modal ---------- */}
          {editingAppointment && (
            <div className="modal">
              <div className="modal-dialog">
                <div className="modal-content">
                  <h2 className="text-xl mb-4">Edit Appointment</h2>
                  <form onSubmit={handleSave}>
                    {[
                      ['appointmentDate','date'],
                      ['appointmentTime','time'],
                      ['doctor','text'],
                      ['message','textarea'],
                      ['price','number'],
                      ['name','text'],
                      ['phone','text'],
                      ['subCategory','text'],
                      ['treatment','text'],
                    ].map(([field,type])=>(
                      <div key={field} className="mb-3">
                        <label className="block mb-1 capitalize">{field.replace(/([A-Z])/g,' $1')}:</label>
                        {type==='textarea' ? (
                          <textarea name={field} required
                                    value={editingAppointment[field]}
                                    onChange={handleChange}
                                    className="w-full p-2 border rounded"/>
                        ) : (
                          <input type={type} name={field} required
                                 value={editingAppointment[field]}
                                 onChange={handleChange}
                                 className="w-full p-2 border rounded"/>
                        )}
                      </div>
                    ))}
                    <button type="submit"
                            className="bg-blue-500 text-white px-4 py-2 rounded mr-2">
                      Save&nbsp;Changes
                    </button>
                    <button type="button" onClick={()=>setEditingAppointment(null)}
                            className="bg-gray-500 text-white px-4 py-2 rounded">
                      Cancel
                    </button>
                  </form>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.render(<AppointmentsPage/>, document.getElementById('root'));
  </script>
</body>
</html>
